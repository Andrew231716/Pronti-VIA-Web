<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="origin">
  <link rel="stylesheet" href="/Pronti-VIA-Web/vendor/leaflet/leaflet.css" id="pv-leaflet-css">
  <style>
    html,body,#map{margin:0;width:100%;height:100%;font:14px Arial,sans-serif}
    #map{background:#e3eeed}
    .pin{border:2px solid white;border-radius:50%;color:white;font:bold 12px Arial;display:grid;place-items:center;box-shadow:0 2px 5px #153b4750}
    .leaflet-popup-content{font:14px/1.5 Arial}
    .fallback{padding:28px 20px;text-align:center;color:#355055;line-height:1.45}
    .fallback a{color:#007d82;font-weight:700}
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
  (function () {
    const CDN_CSS = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    const CDN_JS = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    const LOCAL_JS = "/Pronti-VIA-Web/vendor/leaflet/leaflet.js";

    function showFallback(detail) {
      const el = document.getElementById("map");
      el.innerHTML =
        '<div class="fallback">Mappa non disponibile' +
        (detail ? " (" + detail + ")" : "") +
        '. <a href="https://www.openstreetmap.org/" target="_blank" rel="noreferrer">Apri OpenStreetMap</a></div>';
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = () => resolve(src);
        s.onerror = () => reject(new Error("script " + src));
        document.head.appendChild(s);
      });
    }

    function ensureCss() {
      const link = document.getElementById("pv-leaflet-css");
      if (!link) return;
      // If local CSS 404'd, swap to CDN.
      const probe = new Image();
      // leaflet.css isn't an image; use fetch HEAD instead when available
      fetch(link.href, { method: "HEAD", cache: "no-store" })
        .then((r) => {
          if (!r.ok) link.href = CDN_CSS;
        })
        .catch(() => {
          link.href = CDN_CSS;
        });
    }

    function bootMap() {
      if (!window.L) {
        showFallback("Leaflet assente");
        return;
      }
      const map = L.map("map", { scrollWheelZoom: false }).setView([37, 19], 4);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>',
      }).addTo(map);
      let layers = L.layerGroup().addTo(map);
      let pick = false;
      let route = null;
      const fallbackColors = ["#007d82", "#4770b1", "#bb7735", "#8965a7", "#c05f67", "#528545"];
      addEventListener("message", (e) => {
        if (e.source !== parent || e.origin !== location.origin || e.data?.type !== "viavia-map") return;
        layers.clearLayers();
        if (route) {
          map.removeLayer(route);
          route = null;
        }
        pick = !!e.data.pick;
        const pts = (e.data.points || []).filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lng));
        pts.forEach((p, i) => {
          const color = p.color || fallbackColors[i % fallbackColors.length];
          const content = document.createElement("div");
          content.innerHTML = `<strong>${p.title || ""}</strong>${p.day ? `<br><small>${p.day}</small>` : ""}`;
          const marker = L.marker([p.lat, p.lng], {
            icon: L.divIcon({
              className: "",
              html: `<div class="pin" style="background:${color};width:28px;height:28px">${i + 1}</div>`,
              iconSize: [28, 28],
            }),
          })
            .addTo(layers)
            .bindPopup(content);
          marker.on("click", () => parent.postMessage({ type: "viavia-pin", id: p.id }, location.origin));
          if (p.id === e.data.selected) marker.openPopup();
        });
        if (pts.length > 1) {
          route = L.polyline(
            pts.map((p) => [p.lat, p.lng]),
            { color: "#007d82", weight: 3, opacity: 0.55, dashArray: "6 8" }
          ).addTo(map);
        }
        if (pts.length) {
          map.fitBounds(
            pts.map((p) => [p.lat, p.lng]),
            { padding: [30, 30], maxZoom: 13 }
          );
        }
        map.invalidateSize();
      });
      map.on("click", (e) => {
        if (pick) parent.postMessage({ type: "viavia-coordinate", lat: e.latlng.lat, lng: e.latlng.lng }, location.origin);
      });
      // Resize after open (modals/iframes often report 0 height initially).
      setTimeout(() => map.invalidateSize(), 120);
      setTimeout(() => map.invalidateSize(), 500);
      parent.postMessage({ type: "viavia-ready" }, location.origin);
    }

    ensureCss();
    loadScript(LOCAL_JS)
      .catch(() => loadScript(CDN_JS))
      .then(() => bootMap())
      .catch(() => showFallback("caricamento fallito"));
  })();
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="origin">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" id="pv-leaflet-css">
  <style>
    html,body,#map{margin:0;width:100%;height:100%;font:14px Arial,sans-serif}
    #map{background:#e3eeed}
    .pin{border:2px solid white;border-radius:50%;color:white;font:bold 12px Arial;display:grid;place-items:center;box-shadow:0 2px 5px #153b4750}
    .pin-label{position:absolute;left:50%;top:100%;transform:translate(-50%,2px);background:#fff;color:#16353b;border:1px solid #c9dbdb;border-radius:6px;padding:1px 5px;font:700 10px Arial;white-space:nowrap;box-shadow:0 1px 3px #153b4730}
    .cluster{border:2px solid white;border-radius:50%;background:#007d82;color:#fff;font:bold 12px Arial;display:grid;place-items:center;box-shadow:0 2px 5px #153b4750}
    .leaflet-popup-content{font:14px/1.5 Arial}
    .fallback{padding:28px 20px;text-align:center;color:#355055;line-height:1.45}
    .fallback a{color:#007d82;font-weight:700}
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
  (function () {
    const CDN_CSS = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    const CDN_JS = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    const LOCAL_JS = "/vendor/leaflet/leaflet.js";

    function showFallback(detail) {
      const el = document.getElementById("map");
      el.innerHTML =
        '<div class="fallback">Mappa non disponibile' +
        (detail ? " (" + detail + ")" : "") +
        '. <a href="https://www.openstreetmap.org/" target="_blank" rel="noreferrer">Apri OpenStreetMap</a></div>';
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = () => resolve(src);
        s.onerror = () => reject(new Error("script " + src));
        document.head.appendChild(s);
      });
    }

    function ensureCss() {
      const link = document.getElementById("pv-leaflet-css");
      if (!link) return;
      // If local CSS 404'd, swap to CDN.
      const probe = new Image();
      // leaflet.css isn't an image; use fetch HEAD instead when available
      fetch(link.href, { method: "HEAD", cache: "no-store" })
        .then((r) => {
          if (!r.ok) link.href = CDN_CSS;
        })
        .catch(() => {
          link.href = CDN_CSS;
        });
    }

    function bootMap() {
      if (!window.L) {
        showFallback("Leaflet assente");
        return;
      }
      const DEFAULT_VIEW = [41.9, 12.5];
      const DEFAULT_ZOOM = 4;
      const map = L.map("map", { scrollWheelZoom: false }).setView(DEFAULT_VIEW, DEFAULT_ZOOM);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>',
      }).addTo(map);
      let layers = L.layerGroup().addTo(map);
      let pick = false;
      let route = null;
      let mapOpts = { timeLabels: true, cluster: true };
      const fallbackColors = ["#007d82", "#4770b1", "#bb7735", "#8965a7", "#c05f67", "#528545"];

      function applyDestinationCenter(dest) {
        const d = String(dest || "").toLowerCase();
        if (/islanda|iceland|reykjav|keflav/.test(d)) {
          map.setView([64.8, -18.7], 6);
          return true;
        }
        if (/roma|italy|italia/.test(d)) {
          map.setView([41.9, 12.5], 6);
          return true;
        }
        return false;
      }

      addEventListener("message", (e) => {
        if (e.source !== parent || e.origin !== location.origin) return;
        if (e.data?.type === "viavia-map-options") {
          mapOpts = { ...mapOpts, ...e.data };
          return;
        }
        if (e.data?.type !== "viavia-map") return;
        layers.clearLayers();
        if (route) {
          map.removeLayer(route);
          route = null;
        }
        pick = !!e.data.pick;
        const pts = (e.data.points || []).filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lng));

        // Simple grid clustering when many points are close and zoomed out.
        const useCluster = mapOpts.cluster && pts.length > 8 && map.getZoom() < 11;
        if (useCluster) {
          const cells = new Map();
          pts.forEach((p, i) => {
            const key = `${p.lat.toFixed(1)}:${p.lng.toFixed(1)}`;
            if (!cells.has(key)) cells.set(key, []);
            cells.get(key).push({ p, i });
          });
          for (const group of cells.values()) {
            if (group.length === 1) {
              const { p, i } = group[0];
              addPin(p, i, e.data.selected);
            } else {
              const lat = group.reduce((a, g) => a + g.p.lat, 0) / group.length;
              const lng = group.reduce((a, g) => a + g.p.lng, 0) / group.length;
              L.marker([lat, lng], {
                icon: L.divIcon({
                  className: "",
                  html: `<div class="cluster" style="width:34px;height:34px">${group.length}</div>`,
                  iconSize: [34, 34],
                }),
              })
                .addTo(layers)
                .bindPopup(group.map((g) => g.p.title || "Tappa").join("<br>"));
            }
          }
        } else {
          pts.forEach((p, i) => addPin(p, i, e.data.selected));
        }

        function addPin(p, i, selected) {
          const color = p.color || fallbackColors[i % fallbackColors.length];
          const label =
            mapOpts.timeLabels && (p.time || p.day)
              ? `<div class="pin-label">${p.time || p.day}</div>`
              : "";
          const content = document.createElement("div");
          content.innerHTML = `<strong>${p.title || ""}</strong>${p.day ? `<br><small>${p.day}</small>` : ""}${
            p.time ? `<br><small>${p.time}</small>` : ""
          }`;
          const marker = L.marker([p.lat, p.lng], {
            icon: L.divIcon({
              className: "",
              html: `<div style="position:relative"><div class="pin" style="background:${color};width:28px;height:28px">${
                i + 1
              }</div>${label}</div>`,
              iconSize: [28, 28],
              iconAnchor: [14, 14],
            }),
          })
            .addTo(layers)
            .bindPopup(content);
          marker.on("click", () => parent.postMessage({ type: "viavia-pin", id: p.id }, location.origin));
          if (p.id === selected) marker.openPopup();
        }

        if (pts.length > 1) {
          route = L.polyline(
            pts.map((p) => [p.lat, p.lng]),
            { color: "#007d82", weight: 3, opacity: 0.55, dashArray: "6 8" }
          ).addTo(map);
        }
        if (pts.length) {
          map.fitBounds(
            pts.map((p) => [p.lat, p.lng]),
            { padding: [30, 30], maxZoom: 13 }
          );
        } else if (e.data.destination) {
          applyDestinationCenter(e.data.destination);
        }
        map.invalidateSize();
      });
      map.on("click", (e) => {
        if (pick) parent.postMessage({ type: "viavia-coordinate", lat: e.latlng.lat, lng: e.latlng.lng }, location.origin);
      });
      // Resize after open (modals/iframes often report 0 height initially).
      setTimeout(() => map.invalidateSize(), 120);
      setTimeout(() => map.invalidateSize(), 500);
      parent.postMessage({ type: "viavia-ready" }, location.origin);
    }

    ensureCss();
    loadScript(LOCAL_JS)
      .catch(() => loadScript(CDN_JS))
      .then(() => bootMap())
      .catch(() => showFallback("caricamento fallito"));
  })();
  </script>
</body>
</html>

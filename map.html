<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="origin"><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>html,body,#map{margin:0;width:100%;height:100%;font:14px Arial}#map{background:#e3eeed}.pin{background:#007d82;border:2px solid white;border-radius:50%;color:white;font:bold 13px Arial;display:grid;place-items:center;box-shadow:0 2px 5px #153b4750}.leaflet-popup-content{font:14px/1.5 Arial}.fallback{padding:30px;text-align:center;color:#456}</style></head><body><div id="map"></div><script src="/vendor/leaflet/leaflet.js"></script><script>
if(!window.L){document.getElementById('map').innerHTML='<div class="fallback">Mappa non disponibile. Puoi aprire ogni luogo nella tua app di mappe.</div>';}else{const map=L.map('map',{scrollWheelZoom:false}).setView([37,19],4);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,referrerPolicy:'origin',attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>'}).addTo(map);let layers=L.layerGroup().addTo(map),pick=false;const colors=['#007d82','#4770b1','#bb7735','#8965a7','#c05f67','#528545'];addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='viavia-map')return;layers.clearLayers();pick=!!e.data.pick;const pts=e.data.points.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));pts.forEach((p,i)=>{const content=document.createElement('div');content.textContent=p.title;const marker=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'pin',html:String(i+1),iconSize:[28,28]})}).addTo(layers).bindPopup(content);marker.on('click',()=>parent.postMessage({type:'viavia-pin',id:p.id},location.origin));if(p.id===e.data.selected)marker.openPopup();});if(pts.length){map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[30,30],maxZoom:13});}map.invalidateSize();});map.on('click',e=>{if(pick)parent.postMessage({type:'viavia-coordinate',lat:e.latlng.lat,lng:e.latlng.lng},location.origin)});parent.postMessage({type:'viavia-ready'},location.origin);}
</script></body></html>

[build]
  publish = "."
  command = "npm install --omit=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.search]
  # Live aggregator + hotel polling needs a longer window than default.
  timeout = 26

[[redirects]]
  from = "/api/account"
  to = "/.netlify/functions/account"
  status = 200
  force = true

[[redirects]]
  from = "/api/account/*"
  to = "/.netlify/functions/account"
  status = 200
  force = true

[[redirects]]
  from = "/api/places"
  to = "/.netlify/functions/places"
  status = 200
  force = true

[[redirects]]
  from = "/api/places/*"
  to = "/.netlify/functions/places"
  status = 200
  force = true

[[redirects]]
  from = "/api/trips"
  to = "/.netlify/functions/trips"
  status = 200
  force = true

[[redirects]]
  from = "/api/trips/*"
  to = "/.netlify/functions/trips/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/share"
  to = "/.netlify/functions/share"
  status = 200
  force = true

[[redirects]]
  from = "/api/share/*"
  to = "/.netlify/functions/share/:splat"
  status = 200
  force = true

# Trip invite landing with Open Graph preview (WhatsApp / iMessage / Telegram…).
[[redirects]]
  from = "/invito"
  to = "/.netlify/functions/invite"
  status = 200
  force = true

[[redirects]]
  from = "/invito/*"
  to = "/.netlify/functions/invite/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/invite"
  to = "/.netlify/functions/invite"
  status = 200
  force = true

[[redirects]]
  from = "/api/invite/*"
  to = "/.netlify/functions/invite/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200
  force = true

[[redirects]]
  from = "/api/search/*"
  to = "/.netlify/functions/search"
  status = 200
  force = true

[[redirects]]
  from = "/api/flight-booking"
  to = "/.netlify/functions/flight-booking"
  status = 200
  force = true

[[redirects]]
  from = "/api/flight-booking/*"
  to = "/.netlify/functions/flight-booking"
  status = 200
  force = true

# CORS-safe proxy for remaining /api routes (never raw-proxy Supabase: no ACAO).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

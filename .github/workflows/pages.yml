name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p site
          for f in index.html 404.html account.js account.css api-shim.js places-suggest.js \
                   favicon.svg logo.png coast.jpg manifest.webmanifest map.html \
                   vercel.json _redirects README.md pronti-via-logo.png; do
            [ -f "$f" ] && cp -a "$f" site/
          done
          [ -d assets ] && cp -a assets site/
          [ -d vendor ] && cp -a vendor site/
          [ -d brand ] && cp -a brand site/

          # Project Pages live at /<repo>/ — rewrite root-absolute static paths.
          # Keep /api/* as-is so the client shim can intercept same-origin API calls.
          python3 <<'PY'
          import os
          from pathlib import Path

          base = f"/{os.environ['REPO_NAME']}"
          root = Path("site")
          suffixes = {".html", ".js", ".css", ".webmanifest", ".json", ".svg"}
          # Longest-first so /account.css wins over /account
          prefixes = [
              "/assets/",
              "/vendor/",
              "/places-suggest.js",
              "/api-shim.js",
              "/account.css",
              "/account.js",
              "/manifest.webmanifest",
              "/pronti-via-logo.png",
              "/favicon.svg",
              "/logo.png",
              "/coast.jpg",
              "/map.html",
          ]

          def rewrite(text: str) -> str:
              out = text
              for prefix in prefixes:
                  for quote in ('"', "'", "`"):
                      out = out.replace(f"{quote}{prefix}", f"{quote}{base}{prefix}")
                  # also unquoted in url(...)
                  out = out.replace(f"url({prefix}", f"url({base}{prefix}")
                  out = out.replace(f"url('{prefix}", f"url('{base}{prefix}")
                  out = out.replace(f'url("{prefix}', f'url("{base}{prefix}')
              return out

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in suffixes:
                  continue
              original = path.read_text(encoding="utf-8", errors="ignore")
              updated = rewrite(original)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  print(f"rewrote {path}")

          print(f"base={base}")
          PY
          ls -la site
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
